{% extends "base.html" %}

{% block title %}Error {{ error_code }} - motivClick{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50">
    <div class="max-w-md w-full text-center">
        <div class="bg-white shadow-lg rounded-lg p-8">
            <i class="fas fa-exclamation-triangle text-6xl text-yellow-500 mb-4"></i>
            <h1 class="text-4xl font-bold text-gray-900 mb-2">
                Error {{ error_code }}
            </h1>
            <p class="text-gray-600 mb-6">
                {{ error_message }}
            </p>
            <a href="{{ url_for('dashboard') if session.user_id else url_for('login') }}" 
               class="inline-flex items-center px-6 py-3 border border-transparent rounded-lg shadow-sm text-base font-medium text-white bg-indigo-600 hover:bg-indigo-700 transition">
                <i class="fas fa-home mr-2"></i>
                Go to {% if session.user_id %}Dashboard{% else %}Login{% endif %}
            </a>
        </div>
    </div>
</div>
{% endblock %}
